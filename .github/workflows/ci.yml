name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-go:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.26.2'

    - name: Build Services
      run: |
        go work sync
        for dir in services/*; do (cd "$dir" && go build ./...); done
        for dir in libs/*; do (cd "$dir" && go build ./...); done

    - name: Run Tests
      run: |
        for dir in services/*; do (cd "$dir" && go test ./...); done
        for dir in libs/*; do (cd "$dir" && go test ./...); done

  build-frontend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'

    - name: Install dependencies
      working-directory: ./apps/web
      run: npm ci

    - name: Build
      working-directory: ./apps/web
      run: npm run build
